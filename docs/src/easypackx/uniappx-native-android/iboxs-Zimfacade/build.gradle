plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'uts.sdk.modules.iboxsZimfacade'
    compileSdk 35

    defaultConfig {
        minSdk 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    compileOnly fileTree(include: ['*.aar', '*.jar'], dir: '../app/libs')
    compileOnly fileTree(include: ['*.aar', '*.jar'], dir: './libs')
    compileOnly fileTree(include: ['*.aar', '*.jar'], dir: '../uniappx/libs')
    compileOnly "com.alibaba:fastjson:1.2.83"
    compileOnly "androidx.core:core-ktx:1.10.1"
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.8'
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.8'
    implementation 'io.github.itlattice:aliyunBase:1.0.3'
    implementation 'io.github.itlattice:aliyunDeepSec:1.0.2'
    implementation 'io.github.itlattice:aliyunFace:1.0.2'
    implementation 'io.github.itlattice:aliyunFaceaudio:1.0.3'
    implementation 'io.github.itlattice:aliyunFacade:1.0.2'
    implementation 'io.github.itlattice:AliyunFaceGuard:1.0.2'
    implementation 'io.github.itlattice:aliyunFacelanguage:1.0.2'
    implementation 'io.github.itlattice:aliyunFacequality:1.0.2'
    implementation 'io.github.itlattice:aliyunNfc:4.85'
    implementation 'io.github.itlattice:aliyunOcr:1.0.2'
    implementation 'io.github.itlattice:aliyunPhotinus:1.0.2'
    implementation 'io.github.itlattice:aliyunWishverify:1.0.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:3.11.0'
    implementation 'com.squareup.okio:okio:1.14.0'
    implementation 'com.alibaba:fastjson:1.2.83_noneautotype'
}
